name: PassGenerator
options:
  bundleIdPrefix: com.p360.passgenerator
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  PassGenerator:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: PassGenerator
    info:
      path: PassGenerator/Info.plist
      properties:
        CFBundleDisplayName: Pass Generator
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p360.passgenerator
        PRODUCT_NAME: "Pass Generator"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PassGenerator:
    build:
      targets:
        PassGenerator: all
    run:
      config: Debug
    archive:
      config: Release
